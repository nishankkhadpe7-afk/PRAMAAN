name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scan the full history, not only the latest commit
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.28.0
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks version
      - name: Scan history
        run: ./gitleaks git --config .gitleaks.toml --redact --verbose --exit-code 1 .
      - name: Block AI-tool folders and env files
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.(claude|cursor|gemini|specstory|aider[^/]*)(/|$)|(^|/)\.env($|\.)' | grep -v '\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "These files can hold credentials and must not be committed:"; echo "$tracked"; exit 1
          fi
